name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Vor jeder Veröffentlichung (release.yml)
  workflow_call:

jobs:
  backend:
    # Wie der Zielserver: Ubuntu 24.04 LTS mit Python 3.12 und PostgreSQL 16 (Paketstand der Distribution)
    runs-on: ubuntu-24.04
    name: backend (Ubuntu 24.04, Python 3.12, PostgreSQL 16)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: teamplaner
          POSTGRES_USER: teamplaner
          POSTGRES_PASSWORD: teamplaner-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U teamplaner"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SECRET_KEY: ci-nur-fuer-tests
      POSTGRES_HOST: localhost
      POSTGRES_DB: teamplaner
      POSTGRES_USER: teamplaner
      POSTGRES_PASSWORD: teamplaner-ci
      TEAMPLANER_STATIC_MANIFEST: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Code-Stil (ruff)
        run: ruff check .
      - name: Betriebsskripte (shellcheck)
        run: shellcheck --severity=warning werkzeuge/*.sh betrieb/linux/teamplaner betrieb/linux/*.sh pruefung/linux/*.sh
      - name: Migrationen vollständig
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (Rechteprüfung, Einteilungslogik, Abläufe, Übersetzung)
        run: pytest

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    # Browser-Tests der wichtigsten Abläufe (frontend/e2e) gegen frische Demodaten
    runs-on: ubuntu-24.04
    name: e2e (Browser-Tests, Chromium)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: teamplaner
          POSTGRES_USER: teamplaner
          POSTGRES_PASSWORD: teamplaner-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U teamplaner"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # werkzeuge/e2e-server.sh legt daneben die Datenbank teamplaner_e2e an
      POSTGRES_HOST: localhost
      POSTGRES_USER: teamplaner
      POSTGRES_PASSWORD: teamplaner-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Chromium für Playwright
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser-Tests
        run: npm run e2e
        working-directory: frontend
      - name: Bericht bei Fehlschlag (Trace, Bildschirmfoto)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-bericht
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
