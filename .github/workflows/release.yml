# Neue Version veröffentlichen: ein Git-Tag vX.Y.Z löst Tests und den Bau des Installationsarchivs
# für den Linux-Server aus und legt einen Release-Eintrag mit Archiv und Prüfsumme an.
# Vorher lokal prüfen: pruefung/linux/pruefen.sh (docs/entwicklung.md).
name: Veröffentlichen

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    # Wie der Zielserver: Ubuntu 24.04 LTS, Python 3.12 (Wheels im Archiv passen genau dazu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installationsarchiv bauen
        run: |
          werkzeuge/paket-bauen.sh "${GITHUB_REF_NAME#v}"
          ls -l dist
      - name: Release-Eintrag mit Installationsarchiv anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Teamplaner ${GITHUB_REF_NAME#v}" --generate-notes dist/*
