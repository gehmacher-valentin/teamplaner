# Neue Version veröffentlichen: ein Git-Tag vX.Y.Z löst Tests, den Bau der Container-Pakete
# (amd64, arm64) und des Installationsarchivs für Linux-Server ohne Docker aus und legt einen
# Release-Eintrag mit Archiv und Prüfsumme an.
# Vorher lokal prüfen: pruefung/linux/pruefen.sh (docs/entwicklung.md).
name: Veröffentlichen

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  paket:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-app
          # 1.2.3, 1.2 und latest (latest nur für die höchste Version ohne Zusatz wie -rc1)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: TEAMPLANER_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Pakete prüfen (amd64 und arm64)
        run: |
          for plattform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$plattform" --entrypoint python \
              "ghcr.io/${{ github.repository }}-app:${{ steps.meta.outputs.version }}" \
              -c "import django, psycopg, argon2, nh3, PIL, pi_heif, platform; print(platform.machine(), open('VERSION').read().strip())"
          done

  # Installationsarchiv für Linux-Server ohne Docker (docs/installation-linux.md)
  linux-paket:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Archiv bauen
        run: |
          docker buildx build --target linux-paket --build-arg "TEAMPLANER_VERSION=${GITHUB_REF_NAME#v}" \
            --cache-from type=gha --output type=local,dest=dist .
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: linux-paket
          path: dist/
          retention-days: 3

  release:
    needs: [paket, linux-paket]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-paket
          path: dist
      - name: Release-Eintrag mit Installationsarchiv anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Teamplaner ${GITHUB_REF_NAME#v}" --generate-notes dist/*
