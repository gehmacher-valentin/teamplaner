# Teamplaner hinter nginx – Vorlage (INSTALLATION.md, Abschnitt „Webserver“).
# Anzupassen: teamplaner.example.org (2×) und die beiden Zertifikatspfade.
# Server ohne IPv6 (Kernel mit ipv6.disable=1, nginx -t meldet „Address family not supported by
# protocol“): die beiden Zeilen „listen [::]…“ entfernen.
# Debian/Ubuntu: /etc/nginx/sites-available/teamplaner.conf + Link nach sites-enabled
# RHEL & Co.:    /etc/nginx/conf.d/teamplaner.conf

upstream teamplaner {
    # TEAMPLANER_HOST/TEAMPLANER_PORT aus /etc/teamplaner/teamplaner.env
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name teamplaner.example.org;
    return 301 https://$host$request_uri;
}

server {
    # HTTP/2 ist wichtig: jede offene Teamplaner-Seite hält eine Live-Verbindung, mit HTTP/1.1 sind
    # pro Browser nur 6 gleichzeitig möglich. Ab nginx 1.25.1: "listen 443 ssl;" plus "http2 on;"
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name teamplaner.example.org;

    ssl_certificate     /etc/ssl/teamplaner/zertifikat.pem;
    ssl_certificate_key /etc/ssl/teamplaner/schluessel.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Anhänge bis TEAMPLANER_ANHANG_MAX_MB (Standard 25) plus Formulardaten; wird der Wert erhöht,
    # hier mitziehen – größere Anfragen weist der Webserver ab, bevor sie die Platte füllen
    client_max_body_size 30m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://teamplaner;
    }

    # Live-Aktualisierung (Server-Sent Events): nicht puffern, Verbindung lange offen halten
    location /api/planung/stream {
        proxy_pass http://teamplaner;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
    }

    # Während Updates und Neustarts: Hinweisseite statt Fehlermeldung (lädt sich selbst neu)
    error_page 502 503 504 =503 /wartung.html;
    location = /wartung.html {
        root /opt/teamplaner/wartung;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "20" always;
    }
}
