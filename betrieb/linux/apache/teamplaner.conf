# Teamplaner hinter Apache httpd – Vorlage (INSTALLATION.md, Abschnitt „Webserver“).
# Anzupassen: teamplaner.example.org (3×) und die beiden Zertifikatspfade; bei anderem
# TEAMPLANER_PROGRAMM als /opt/teamplaner auch der Pfad der Wartungsseite (2×, unten).
# Module: ssl, proxy, proxy_http, headers, http2 (Debian/Ubuntu: a2enmod ssl proxy proxy_http headers http2)
# Debian/Ubuntu: /etc/apache2/sites-available/teamplaner.conf, dann a2ensite teamplaner
# RHEL & Co.:    /etc/httpd/conf.d/teamplaner.conf (Pakete httpd, mod_ssl, mod_http2)

<VirtualHost *:80>
    ServerName teamplaner.example.org
    Redirect permanent / https://teamplaner.example.org/
</VirtualHost>

<VirtualHost *:443>
    ServerName teamplaner.example.org

    SSLEngine on
    SSLCertificateFile    /etc/ssl/teamplaner/zertifikat.pem
    SSLCertificateKeyFile /etc/ssl/teamplaner/schluessel.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    # HTTP/2 ist wichtig: jede offene Teamplaner-Seite hält eine Live-Verbindung, mit HTTP/1.1 sind
    # pro Browser nur 6 gleichzeitig möglich
    Protocols h2 http/1.1

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

    # Anhänge bis TEAMPLANER_ANHANG_MAX_MB (Standard 25) plus Formulardaten (30 MB); bei höherem
    # TEAMPLANER_ANHANG_MAX_MB mitziehen
    LimitRequestBody 31457280

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # Während Updates und Neustarts: Hinweisseite statt Fehlermeldung (lädt sich selbst neu),
    # liegt unter TEAMPLANER_PROGRAMM/wartung
    Alias /wartung.html /opt/teamplaner/wartung/wartung.html
    <Directory /opt/teamplaner/wartung>
        Require all granted
    </Directory>
    ProxyPass /wartung.html !
    ErrorDocument 502 /wartung.html
    ErrorDocument 503 /wartung.html

    # TEAMPLANER_HOST/TEAMPLANER_PORT aus der Konfiguration (teamplaner.env).
    # retry=0: nach einem Neustart sofort wieder weiterleiten (sonst bis zu 60 s Wartungsseite)
    # Live-Aktualisierung (Server-Sent Events): sofort weiterreichen, lange offen halten, nicht komprimieren
    ProxyPass        /api/planung/stream http://127.0.0.1:8000/api/planung/stream flushpackets=on timeout=3600 retry=0
    SetEnvIf Request_URI "^/api/planung/stream" no-gzip
    ProxyPass        / http://127.0.0.1:8000/ timeout=120 retry=0
    ProxyPassReverse / http://127.0.0.1:8000/
</VirtualHost>
