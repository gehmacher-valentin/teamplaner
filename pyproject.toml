[project]
name = "teamplaner"
version = "0.1.0"
description = "Aufgabenverwaltung und Wochenplanung für Teams"
# Zielsystem: Ubuntu 24.04 LTS mit Python 3.12 (docs/installation-linux.md)
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "teamplaner.settings"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["argon2: läuft mit dem Passwort-Hasher des Betriebs (Argon2) statt mit dem schnellen der Tests"]
filterwarnings = ["ignore::DeprecationWarning:axes.*", "ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*", "frontend", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
ignore = ["E501"]
