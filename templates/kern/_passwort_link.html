{% load i18n %}{% if link %}
  <div class="meldung meldung--success passwort-link" role="status">
    <div class="stapel passwort-link__text">
      <strong>{% translate "Link zum Festlegen des Passworts" %}</strong>
      <div class="zeile"><code class="umbruch">{{ link }}</code><button type="button" class="knopf knopf--klein" data-kopieren="{{ link }}">{% translate "Link kopieren" %}</button></div>
    </div>
    <div class="passwort-link__qr" role="img" aria-label="{% translate 'QR-Code' %}">{{ link_qr }}</div>
  </div>
{% endif %}
