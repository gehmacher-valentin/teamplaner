{% extends "base.html" %}
{% load static i18n %}

{% block kopf %}<link rel="stylesheet" href="{% static 'dist/teamplaner.css' %}">{% endblock %}
{% block inhalt %}
  <div id="teamplaner" data-planen="{% if planen %}1{% else %}0{% endif %}">

  </div>
{% endblock %}
{% block skripte %}<script type="module" src="{% static 'dist/teamplaner.js' %}"></script>{% endblock %}
