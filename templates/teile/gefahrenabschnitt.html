{% load i18n %}{# Löschen, Deaktivieren, Archivieren als letzter Abschnitt einer Formularseite, immer mit Rückfrage #}<section class="gefahrenabschnitt" aria-labelledby="{{ id }}-titel">
  <h2 id="{{ id }}-titel">{{ titel }}</h2>
  <button type="button" class="knopf knopf--gefahr" data-dialog-oeffnen="#{{ id }}">{{ knopf }} …</button>
  <dialog id="{{ id }}" aria-labelledby="{{ id }}-frage">
    <form method="post" action="{{ aktion }}" class="dialog__inhalt">
      {% csrf_token %}
      <h2 id="{{ id }}-frage">{{ frage }}</h2>
      {% if text %}<p class="ohne-rand">{{ text }}</p>{% endif %}
      <div class="formular__aktionen formular__aktionen--rechts">
        <button type="button" class="knopf" data-dialog-schliessen>{% translate "Abbrechen" %}</button>
        <button type="submit" class="knopf knopf--gefahr-voll">{{ knopf }}</button>
      </div>
    </form>
  </dialog>
</section>
