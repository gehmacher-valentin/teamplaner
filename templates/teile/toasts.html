{% load i18n %}{# Django-Meldungen als Toast; lib/toast.ts gibt ihnen Zeitgeber und × #}<div id="toasts" class="toasts" aria-live="polite">
  {% for m in messages %}{% with art=m.level_tag %}
    <div class="toast toast--{% if art == 'error' or art == 'warning' %}fehler{% elif art == 'success' %}erfolg{% else %}info{% endif %}" role="{% if art == 'error' or art == 'warning' %}alert{% else %}status{% endif %}">
      <svg class="toast__symbol" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{% if art == 'error' or art == 'warning' %}<path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17h.01"/>{% elif art == 'success' %}<path d="M5 12l5 5L20 7"/>{% else %}<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>{% endif %}</svg>
      <span class="toast__text">{{ m }}</span>
      <button type="button" class="toast__zu" aria-label="{% translate 'Schließen' %}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  {% endwith %}{% endfor %}
</div>
