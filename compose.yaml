# Lokale Entwicklungsumgebung. Start: docker compose up
# Produktion: siehe docs/betrieb.md (compose.prod.yaml)
x-app-umgebung: &app-umgebung
  DJANGO_DEBUG: "1"
  DJANGO_SECRET_KEY: dev-nicht-fuer-produktion
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  POSTGRES_HOST: db
  POSTGRES_DB: teamplaner
  POSTGRES_USER: teamplaner
  POSTGRES_PASSWORD: teamplaner-dev
  TEAMPLANER_STATIC_MANIFEST: "0"
  # Alle Mails landen in Mailpit: http://localhost:8025
  EMAIL_HOST: mailpit
  EMAIL_PORT: "1025"
  EMAIL_USE_TLS: "0"
  TEAMPLANER_ADRESSE: http://localhost:8000
  # Dateiänderungen aus Windows-Volumes werden nur per Polling erkannt
  WATCHFILES_FORCE_POLLING: "true"

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: teamplaner
      POSTGRES_USER: teamplaner
      POSTGRES_PASSWORD: teamplaner-dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamplaner -d teamplaner"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      target: dev
    environment: *app-umgebung
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Verschickt E-Mail-Benachrichtigungen (nach Codeänderungen: docker compose restart mailer)
  mailer:
    build:
      context: .
      target: dev
    command: ["python", "manage.py", "mails_versenden", "--dauerhaft"]
    environment: *app-umgebung
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  # Fängt alle E-Mails ab (nur Entwicklung)
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
